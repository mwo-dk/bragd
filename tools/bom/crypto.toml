# Every cryptographic algorithm and protocol Bragd uses, for its CBOM (tools/bom/README.md).
#
# Kept by hand: no scanner reads Rust well enough yet. generate.sh checks it against the build:
# every crate in `watch` that Cargo.lock has must be a [[library]] here, every library must be
# in Cargo.lock, and every `found` pattern must still match its file. So a new crypto
# dependency, or code that moved, fails the build of the CBOM instead of going unnoticed.
#
# Today that is TLS (rustls with ring, through ureq) for the update check, tablebase downloads
# and the Lichess tablebase API. Each new use arrives here as a [[library]] with the [[asset]]s
# Bragd really uses, in the pull request that adds it.

# Crates that do cryptography. Add one when a new dependency brings some in.
watch = [
  "aes", "aes-gcm", "argon2", "aws-lc-rs", "blake2", "blake3", "cbc", "chacha20", "chacha20poly1305",
  "ctr", "curve25519-dalek", "ed25519-dalek", "getrandom", "hkdf", "hmac", "md-5", "md5", "native-tls", "openssl", "p256", "p384",
  "pbkdf2", "ring", "rsa", "rustls", "scrypt", "sha1", "sha2", "sha3", "spake2", "x25519-dalek", "zip",
]

# ---------------------------------------------------------------------------- libraries
# A crate that provides algorithms. `provides` names assets below.

[[library]]
crate = "rustls"
provides = ["tls-1.3", "tls-1.2"]

[[library]]
crate = "ring"
provides = ["aes-128-gcm", "aes-256-gcm", "chacha20-poly1305", "sha-256", "sha-384", "x25519", "ecdh-p256", "ecdh-p384", "ecdsa-p256", "ecdsa-p384", "ed25519", "rsa-pss", "rsa-pkcs1"]

# SHA-256 in the desktop app's webview layer: tauri-codegen (at build time) and wry hash the
# app's own scripts and styles into the Content-Security-Policy. No user data is hashed. Bragd
# itself checks Pikafish's release archive and its evaluation network against their digests.
[[library]]
crate = "sha2"
provides = ["sha-256"]

# BLAKE3: every Syzygy tablebase file is checked against the sum that comes with Bragd.
[[library]]
crate = "blake3"
provides = ["blake3"]

# The operating system's random numbers. ring takes each TLS connection's keys and nonces from
# it, which the TLS assets cover; ahash (for parquet) seeds its hash tables from it, which is
# not cryptography, and neither is zip's random name for its extraction folder. The Helper
# takes its connection token from it, the app and the Helper their dice and sticks, and an engine
# match the seed of its openings.
[[library]]
crate = "getrandom"
provides = ["os-random"]

# The Helper's zip reader for downloaded Sources. Without the aes-crypto feature its only cipher is
# the legacy ZipCrypto decryption, which Bragd never calls: no password is ever given to it.
[[library]]
crate = "zip"
provides = []

# The Secret Service on Linux and the BSDs (dbus-secret-service, for the language model's key in
# the keychain): the session with it is opened by a Diffie-Hellman exchange in the 1024-bit MODP
# group the Secret Service specifies, its key derived by HKDF-SHA-256, and the secret crossing the
# session bus encrypted with AES-128-CBC. macOS and Windows use the system's own keychain API.
[[library]]
crate = "aes"
provides = ["aes-128-cbc"]

[[library]]
crate = "cbc"
provides = ["aes-128-cbc"]

[[library]]
crate = "hkdf"
provides = ["hkdf-sha-256"]

[[library]]
crate = "hmac"
provides = ["hmac-sha-256"]

# Peers (crates/bragd-peers): the pairing code turned into a shared key by SPAKE2, in the Ed25519
# group that curve25519-dalek provides. ring, above, makes each machine's Ed25519 key and signs
# its TLS handshakes; hmac and sha2 confirm the SPAKE2 key.
[[library]]
crate = "spake2"
provides = ["spake2"]

[[library]]
crate = "curve25519-dalek"
provides = ["spake2"]

[[library]]
crate = "dbus-secret-service"
provides = ["dh-modp-1024"]

# ---------------------------------------------------------------------------- assets
# CycloneDX cryptoProperties, plus `purpose` (why Bragd uses it, a property in the CBOM) and
# `found`: where our code uses it, as a file and a pattern on one of its lines.

# TLS, through ureq with rustls and ring. The update check verifies certificates through the
# operating system (rustls-platform-verifier), so a machine behind a TLS-inspecting proxy that
# trusts its own CA still works. Tablebase downloads and the Lichess tablebase API verify them
# against the Mozilla roots that ureq bundles (webpki-roots).

[[asset]]
ref = "tls-1.3"
name = "TLSv1.3"
type = "protocol"
protocol = "tls"
version = "1.3"
cipher_suites = [
  { name = "TLS_AES_256_GCM_SHA384", algorithms = ["aes-256-gcm", "sha-384"] },
  { name = "TLS_AES_128_GCM_SHA256", algorithms = ["aes-128-gcm", "sha-256"] },
  { name = "TLS_CHACHA20_POLY1305_SHA256", algorithms = ["chacha20-poly1305", "sha-256"] },
]
uses = ["x25519", "ecdh-p256", "ecdh-p384", "ecdsa-p256", "ecdsa-p384", "ed25519", "rsa-pss", "rsa-pkcs1"]
purpose = "The update check, Source downloads, Syzygy tablebase downloads and the Lichess tablebase API over HTTPS; between Peers, TLS 1.3 alone with Ed25519 raw public keys (RFC 7250) pinned at pairing"
found = [
  { file = "crates/bragd-core/src/update.rs", pattern = "RootCerts::PlatformVerifier" },
  { file = "crates/bragd-engines/src/fetch.rs", pattern = "RootCerts::PlatformVerifier" },
  { file = "crates/bragd-peers/src/tls.rs", pattern = "with_protocol_versions(&[&rustls::version::TLS13])" },
]

[[asset]]
ref = "tls-1.2"
name = "TLSv1.2"
type = "protocol"
protocol = "tls"
version = "1.2"
# In TLS 1.2 a suite names the kind of key exchange (ECDHE) and signature, not the curve: the
# curves are the protocol's, under `uses`.
cipher_suites = [
  { name = "TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384", algorithms = ["ecdsa-p256", "ecdsa-p384", "aes-256-gcm", "sha-384"] },
  { name = "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256", algorithms = ["ecdsa-p256", "ecdsa-p384", "aes-128-gcm", "sha-256"] },
  { name = "TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256", algorithms = ["ecdsa-p256", "ecdsa-p384", "chacha20-poly1305", "sha-256"] },
  { name = "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384", algorithms = ["rsa-pkcs1", "aes-256-gcm", "sha-384"] },
  { name = "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256", algorithms = ["rsa-pkcs1", "aes-128-gcm", "sha-256"] },
  { name = "TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256", algorithms = ["rsa-pkcs1", "chacha20-poly1305", "sha-256"] },
]
uses = ["x25519", "ecdh-p256", "ecdh-p384"]
purpose = "The same connections, with servers that do not offer TLS 1.3"
found = [
  { file = "crates/bragd-core/src/update.rs", pattern = "RootCerts::PlatformVerifier" },
  { file = "crates/bragd-engines/src/fetch.rs", pattern = "RootCerts::PlatformVerifier" },
]

[[asset]]
ref = "aes-128-gcm"
name = "AES-128-GCM"
type = "algorithm"
primitive = "ae"
oid = "2.16.840.1.101.3.4.1.6"
param_set = "128"
mode = "gcm"
functions = ["encrypt", "decrypt"]
purpose = "TLS record encryption"

[[asset]]
ref = "aes-256-gcm"
name = "AES-256-GCM"
type = "algorithm"
primitive = "ae"
oid = "2.16.840.1.101.3.4.1.46"
param_set = "256"
mode = "gcm"
functions = ["encrypt", "decrypt"]
purpose = "TLS record encryption"

[[asset]]
ref = "chacha20-poly1305"
name = "ChaCha20-Poly1305"
type = "algorithm"
primitive = "ae"
functions = ["encrypt", "decrypt"]
purpose = "TLS record encryption"

[[asset]]
ref = "sha-256"
name = "SHA-256"
type = "algorithm"
primitive = "hash"
oid = "2.16.840.1.101.3.4.2.1"
param_set = "256"
functions = ["digest"]
purpose = "TLS handshake transcript and key schedule; the Content-Security-Policy's script hashes; checking a downloaded engine network against its digest; HKDF in the Secret Service session"
found = [{ file = "crates/bragd-engines/src/network.rs", pattern = "hash: Sha256::new()" }]

[[asset]]
ref = "blake3"
name = "BLAKE3"
type = "algorithm"
primitive = "hash"
param_set = "256"
functions = ["digest"]
purpose = "Checking each downloaded Syzygy tablebase file against the sum that comes with Bragd"
found = [{ file = "crates/bragd-engines/src/syzygy.rs", pattern = "blake3::Hasher::new()" }]

[[asset]]
ref = "sha-384"
name = "SHA-384"
type = "algorithm"
primitive = "hash"
oid = "2.16.840.1.101.3.4.2.2"
param_set = "384"
functions = ["digest"]
purpose = "TLS handshake transcript and key schedule"

[[asset]]
ref = "x25519"
name = "X25519"
type = "algorithm"
primitive = "key-agree"
curve = "curve25519"
functions = ["keygen", "keyderive"]
purpose = "TLS key exchange (preferred)"

[[asset]]
ref = "ecdh-p256"
name = "ECDH-secp256r1"
type = "algorithm"
primitive = "key-agree"
curve = "secp256r1"
functions = ["keygen", "keyderive"]
purpose = "TLS key exchange"

[[asset]]
ref = "ecdh-p384"
name = "ECDH-secp384r1"
type = "algorithm"
primitive = "key-agree"
curve = "secp384r1"
functions = ["keygen", "keyderive"]
purpose = "TLS key exchange"

[[asset]]
ref = "ecdsa-p256"
name = "ECDSA-secp256r1"
type = "algorithm"
primitive = "signature"
curve = "secp256r1"
functions = ["verify"]
purpose = "Checking servers' certificates and handshake signatures"

[[asset]]
ref = "ecdsa-p384"
name = "ECDSA-secp384r1"
type = "algorithm"
primitive = "signature"
curve = "secp384r1"
functions = ["verify"]
purpose = "Checking servers' certificates and handshake signatures"

[[asset]]
ref = "ed25519"
name = "Ed25519"
type = "algorithm"
primitive = "signature"
curve = "ed25519"
functions = ["keygen", "sign", "verify"]
purpose = "Checking servers' certificates and handshake signatures; each machine's key for Peers, made once, which signs its TLS handshakes with them"
