[[asset]]
ref = "os-random"
name = "OS random source"
type = "algorithm"
primitive = "drbg"
functions = ["generate"]
purpose = "The pairing code a machine shows for Peers, the token that lets only this user's Bragd windows talk to the Helper, the throws of dice and sticks in the race games, and the seed an engine match chooses its openings by"
found = [
  { file = "crates/bragd-helper/src/helper.rs", pattern = "getrandom::fill(&mut bytes)" },
  { file = "crates/bragd-core/src/throw.rs", pattern = "getrandom::fill(&mut b)" },
  { file = "crates/bragd-peers/src/node.rs", pattern = "getrandom::fill(&mut b)" },
]

[[asset]]
ref = "aes-128-cbc"
