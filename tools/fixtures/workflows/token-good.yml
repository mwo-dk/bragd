# tools/workflow-shell-check.py: the build holds no token that can write, and the job that
# writes builds nothing (a comment saying cargo build or npm ci does not count).
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: cargo build --release # read-only token: fine
      - uses: actions/upload-artifact@v7
        with:
          name: app
          path: target/release/app
  upload:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app
      - run: packaging/retry.sh gh release upload v1 app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  image:
    runs-on: ubuntu-24.04
    steps:
      - run: docker buildx build packaging/images/stockfish --output type=oci,dest=image.tar
      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: image.tar
  push:
    needs: image
    permissions:
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image
      - run: echo "$TOKEN" | skopeo login ghcr.io -u "$ACTOR" --password-stdin
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: skopeo copy --all --preserve-digests oci-archive:image.tar docker://ghcr.io/o/img:1
