# cargo deny: advisories, licences, duplicate crates and sources. The Dependencies workflow
# (deps.yml) runs it on every pull request that changes a dependency, on master and weekly.
# tools/bom/about.toml accepts the same licences.
[advisories]
# An advisory is fixed, not ignored (CLAUDE.md, No legacy). One that cannot be fixed yet goes
# here with its reason and the crate that pulls it in.
ignore = [
  "RUSTSEC-2024-0370", # proc-macro-error: unmaintained; proc macro inside glib 0.18 (gtk-rs), pulled by tauri. Drop when tauri moves to gtk-rs 0.19+.
  "RUSTSEC-2026-0370", # zvariant: unmaintained (merged into zbus 6); pulled by zbus 5 via tauri-plugin-opener. Drop when opener uses zbus 6.
  "RUSTSEC-2026-0371", # zbus_names: unmaintained (merged into zbus 6); pulled by zbus 5 via tauri-plugin-opener. Drop when opener uses zbus 6.
  "RUSTSEC-2026-0372", # zvariant_derive: unmaintained (merged into zbus 6); pulled by zbus 5 via tauri-plugin-opener. Drop when opener uses zbus 6.
]

[licenses]
allow = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "0BSD", "ISC", "Zlib", "BSL-1.0", "CC0-1.0", "Unlicense", "Unicode-3.0", "MPL-2.0",
  "CDLA-Permissive-2.0",
  # libbz2-rs-sys (pure-Rust bzip2 for .pgn.bz2 downloads) keeps the original bzip2 licence: BSD-style, notice only.
  "bzip2-1.0.6",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Workspace crates depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
