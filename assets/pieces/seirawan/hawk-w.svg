<!--
	hawk-w — Seirawan chess's hawk: a bishop and a knight at once.

	**A raptor head in profile, facing left, exactly as the knight is.**

	Two earlier attempts were wrong in ways worth recording. The first was a
	small profile head perched on the bishop's foot and collar — a bust on a
	plinth, floating in the middle of a tile the knight fills corner to corner.
	The second was frontal, on the theory that every piece in this set faces the
	player, and it came out as a puppy: a round crest beside the skull reads as
	ears, a brow over two eyes reads as a muzzle. The theory was also false. The
	knight does not face the player, and the knight is the most legible piece in
	the set, because a profile animal head is a silhouette and a frontal one is a
	face that has to be read.

	The Alfaerie set states the same rule outright for chess-variant pieces: the
	animals are all profiles facing left, head and neck only. Facing **left**
	matters as much as the profile — two animals on one board looking opposite
	ways is the thing nobody can name and everybody notices.

	This was drawn by hand over fourteen render-and-look rounds, and most of them
	were the wrong bird: a penguin, twice, from a beak that measured deep at the
	base and tapered to nothing before the tip; then a parrot, a goose, a vulture.
	Three things fixed it. The culmen bulges **up and out** rather than dishing
	in. The underside of the beak drops low enough that the wedge stays thick all
	the way to the hook. And a heavy brow slash sits over the eye — that one
	change did more than everything before it.

	**There is no nostril**, and that is a decision. It was tried four ways and
	every one of them read at forty-four pixels as a second eye: a hawk's nostril
	is anatomically beside its eye, where a horse's is a third of the piece away,
	so Cburnett's trick does not transfer. A blank beak is the smaller cost.

	Honest about what it is: nearer an eagle than a red-tail. At board size the
	two are one silhouette, and both are unmistakably not an owl.

	Derived from artwork taken under the 3-clause BSD licence; see
	assets/pieces/LICENCE.md. No share-alike obligation attaches.
-->
