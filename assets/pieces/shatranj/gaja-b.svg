<!--
	gaja-b — the elephant. Chaturanga's, and Seirawan chess's.

	**In profile, facing left, as the knight is.**

	It used to be frontal: a face with two round ears and two dots for eyes, on
	the bishop's foot. Its own comment argued for that — "every piece in this set
	faces the player" — and the claim is false. The knight is in profile, and the
	knight is the most legible piece in the set. The frontal version read as cute,
	which is not a register any other piece here is drawn in, and cute is what it
	was rejected for.

	The Alfaerie set states the rule outright for chess-variant pieces: the
	animals are all profiles facing left, head and neck only.

	Three shapes carry it, in the order they survive at forty-four pixels: **the
	trunk**, a thick taper from between the eyes down past the jaw and curling
	forward — it is the longest line in the piece and it says elephant before
	anything else does; **the ear**, one large shape filling the back of the head;
	and **the tusk** sweeping forward beside the trunk. The eye is small and high
	and does almost nothing, which is correct — on the frontal version two large
	eyes were most of what made it a cartoon.

	**One drawing, two games.** Seirawan's elephant is this file too. Its own
	drawing was a rook's tower with a howdah, reasoned from the fact that it moves
	as a rook, and at board size it read as a rook with a smudge — worse than
	ugly, because a rook is also on that board. The objection to sharing was that
	the set has three animals called an elephant; that matters between the alfil
	and this one, which share one sheet, and not at all between chaturanga and
	Seirawan, which share no board and no sheet.

	Derived from artwork taken under the 3-clause BSD licence; see
	assets/pieces/LICENCE.md. No share-alike obligation attaches.
-->
