<!--
	alfil-w — the shatranj elephant.

	Ours, drawn for this set on Cburnett's bishop foot and collar, with the
	mitre replaced by a tusked head. The tusks are solid shapes rather than
	drawn-on lines, and they break the silhouette on purpose: an alfil is not a
	short-range bishop, and the piece a player picks out at a glance should not
	claim it is.

	Derived from artwork taken under the 3-clause BSD licence; see
	assets/pieces/LICENCE.md. No share-alike obligation attaches.
-->
