<!--
	ferz-w — the shatranj counsellor.

	Ours, drawn for this set from Cburnett's queen: her base, collar and
	mouldings unchanged, with the spiked crown and its five tassels replaced by
	a plain dome and a single finial. That is the piece's history as well as its
	shape — the modern queen is what happened when this piece was given the
	rook's reach — so sharing her body and differing only above the collar says
	something true rather than merely matching.

	Derived from artwork taken under the 3-clause BSD licence; see
	assets/pieces/LICENCE.md. No share-alike obligation attaches.
-->
