<?xml version="1.0" encoding="UTF-8"?>
<!-- ferz-b — see ferz-w.svg. Black body, white mouldings, as the set does. -->
<svg xmlns="http://www.w3.org/2000/svg" width="45" height="45" viewBox="0 0 45 45">
  <g style="fill:#000;stroke:#000;stroke-width:1.5;stroke-linejoin:round">
    <path d="M 9,26 C 9,19 14,13.5 22.5,13.5 C 31,13.5 36,19 36,26 z"/>
    <circle cx="22.5" cy="10" r="2.5"/>
    <path d="M 9,26 C 9,28 10.5,28 11.5,30 C 12.5,31.5 12.5,31 12,33.5 C 10.5,34.5 11,36 11,36 C 9.5,37.5 11,38.5 11,38.5 C 17.5,39.5 27.5,39.5 34,38.5 C 34,38.5 35.5,37.5 34,36 C 34,36 34.5,34.5 33,33.5 C 32.5,31 32.5,31.5 33.5,30 C 34.5,28 36,28 36,26 C 27.5,24.5 17.5,24.5 9,26 z"/>
  </g>
  <g style="fill:none;stroke:#FFF;stroke-width:1.5;stroke-linejoin:round">
    <!-- Where the dome meets the collar. On the white piece this line is there
         for free: it is the top edge of the collar path, stroked in black
         against a white body. On the black piece that same stroke is black on
         black and disappears, so the white ferz had three lines across its
         collar and the black one had two. Drawn explicitly here, so the two
         sides are the same piece. -->
    <path d="M 36,26 C 27.5,24.5 17.5,24.5 9,26" style="fill:none"/>
    <path d="M 11.5,30 C 15,29 30,29 33.5,30" style="fill:none"/>
    <path d="M 12,33.5 C 18,32.5 27,32.5 33,33.5" style="fill:none"/>
  </g>
</svg>
