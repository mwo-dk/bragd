<!--
	archbishop-b — Capablanca chess's bishop and knight at once.

	**A base graft: the knight's head on the bishop's foot.**

	That is the convention, and it is close to universal — Unicode's own chess
	symbols, the Wikimedia set this artwork descends from, and most published
	sets these variants are played with. Fergus Duniho, on the
	Chess Variant Pages, says why the picture has to carry what the name does
	not: "neither name suggests any kind of augmented Knight. Yet this piece
	should be thought of as both an augmented Bishop and an augmented Knight."

	**What this replaces was a knight crammed inside the other piece.** A whole
	bishop with a small horse standing in its mitre — legible at two hundred
	pixels and, at the forty-four the game is played at, a bishop with a smudge
	in it. The point of a compound piece is that both halves are visible, and the
	half that was invisible was the half the name already fails to mention.

	**Drawn from this set's own parts and not from the published variant
	files.** The Wikimedia archbishop and chancellor — `Chess_alt45.svg` and
	`Chess_clt45.svg` — are CC BY-SA 3.0, and Bragd deliberately takes the
	chess set under the 3-clause BSD option instead (assets/pieces/LICENCE.md).
	A convention is not copyrightable and
	path data is, so this is Cburnett's knight — ours, under BSD — set on
	Cburnett's bishop foot, both already in `assets/pieces/basic`.

	The knight is scaled to 0.72 and its stroke width divided by the same, so
	the outline stays 1.5 beside every other piece rather than thinning as it
	shrinks. Its own base line lands inside the bishop's collar, which is drawn after
	it and covers the join.

	Derived from artwork taken under the 3-clause BSD licence; see
	assets/pieces/LICENCE.md. No share-alike obligation attaches.
-->
