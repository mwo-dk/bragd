[package]
name = "bragd-gui"
description = "Bragd: play, study and keep turn-based board games, desktop edition"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bragd-core = { path = "../../crates/bragd-core" }
bragd-games = { path = "../../crates/bragd-games" }
bragd-engines = { path = "../../crates/bragd-engines" }
# Settings opens config.toml in the system's editor and pages in the browser, from Rust.
tauri-plugin-opener = "2"
# Engines, tablebases and their downloads; opening books and names from the library.
bragd-library = { path = "../../crates/bragd-library" }
# The Position store: Analyse and reviews read Evaluations and Annotations from it and write
# them to it; Disk watch exports and imports it.
bragd-positions = { path = "../../crates/bragd-positions" }
# The language model: Settings → Language model and a Comment's Translate.
bragd-model = { path = "../../crates/bragd-model" }
# Clubs, their members and ratings, and the rating lists.
bragd-clubs = { path = "../../crates/bragd-clubs" }
# Lists written into config.toml (the opening books), as bragd-core writes them.
toml_edit = "0.25"
# No `devtools` feature: a release build has no inspector.
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The Rules pages are the Markdown in docs/rules, compiled in and turned into HTML here.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# The Helper: its connection, its requests, Sources and Disk watch (bragd-helper).
bragd-helper = { path = "../../crates/bragd-helper" }
# Foreign databases read in place, Libraries and Slices.
# The file dialog for opening and saving Foreign databases, called from Rust only.
tauri-plugin-dialog = "2"

[features]
# Serve the built frontend (gui/dist) from inside the binary. Without it a plain `cargo build`
# loads the dev server at localhost:1420, which only `tauri dev` starts: run that one as
# `npx tauri dev -- --no-default-features`.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Tests get a home of their own in the temporary folder (`bragd_core::dirs`).
[dev-dependencies]
bragd-core = { path = "../../crates/bragd-core", features = ["test-home"] }
