<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
	<!--
		Ur pieces, drawn rather than sourced.

		The pieces found at Ur are flat discs of shell and shale, each inlaid
		with five dots. The sides are Light and Dark, so the discs are a light
		and a dark one; the dots are what tell them apart from draughts.

		Sized 45x45 to match the chess sprite.
	-->
	<symbol id="ur-l" viewBox="0 0 45 45">
		<title>light piece</title>
		<circle cx="22.5" cy="22.5" r="18" fill="var(--piece-light-fill, #f3ece0)"
			stroke="var(--piece-light-line, #3a3a3a)" stroke-width="1.5" />
		<g fill="var(--piece-light-line, #3a3a3a)">
			<circle cx="22.5" cy="22.5" r="2.4" />
			<circle cx="15" cy="15" r="2.4" />
			<circle cx="30" cy="15" r="2.4" />
			<circle cx="15" cy="30" r="2.4" />
			<circle cx="30" cy="30" r="2.4" />
		</g>
	</symbol>

	<symbol id="ur-d" viewBox="0 0 45 45">
		<title>dark piece</title>
		<circle cx="22.5" cy="22.5" r="18" fill="var(--piece-dark-fill, #2b2b2b)"
			stroke="var(--piece-dark-line, #111)" stroke-width="1.5" />
		<g fill="var(--piece-light-fill, #f3ece0)">
			<circle cx="22.5" cy="22.5" r="2.4" />
			<circle cx="15" cy="15" r="2.4" />
			<circle cx="30" cy="15" r="2.4" />
			<circle cx="15" cy="30" r="2.4" />
			<circle cx="30" cy="30" r="2.4" />
		</g>
	</symbol>

	<!--
		The dice: tetrahedra, seen from above, so three faces and four tips
		show: the tip pointing up in the middle and three at the base. Two of
		the four tips of each die are marked with an inlaid dot. A die thrown
		with a marked tip up counts one; with a plain tip up, nothing. Either
		way the other marked tip lies on the base, so a die always shows its
		two dots. Bone with dark inlay, like the light pieces, so they read on
		a light or a dark panel.
	-->
	<symbol id="ur-die-marked" viewBox="0 0 45 45">
		<title>die, marked tip up</title>
		<g stroke="var(--piece-dark-line, #111)" stroke-width="1.5" stroke-linejoin="round">
			<path d="M22.5 4 L41 37 L22.5 27 Z" fill="var(--piece-light-fill, #f3ece0)" />
			<path d="M41 37 L4 37 L22.5 27 Z" fill="var(--piece-light-fill, #f3ece0)" />
			<path d="M4 37 L22.5 4 L22.5 27 Z" fill="var(--piece-light-fill, #f3ece0)" />
		</g>
		<path d="M22.5 4 L41 37 L22.5 27 Z" fill="#000" opacity="0.08" />
		<path d="M41 37 L4 37 L22.5 27 Z" fill="#000" opacity="0.2" />
		<circle cx="22.5" cy="27" r="3.6" fill="var(--piece-dark-fill, #2b2b2b)"
			stroke="var(--piece-dark-line, #111)" stroke-width="0.8" />
		<circle cx="38" cy="35.2" r="2.2" fill="var(--piece-dark-fill, #2b2b2b)" />
	</symbol>

	<symbol id="ur-die-plain" viewBox="0 0 45 45">
		<title>die, plain tip up</title>
		<g stroke="var(--piece-dark-line, #111)" stroke-width="1.5" stroke-linejoin="round">
			<path d="M22.5 4 L41 37 L22.5 27 Z" fill="var(--piece-light-fill, #f3ece0)" />
			<path d="M41 37 L4 37 L22.5 27 Z" fill="var(--piece-light-fill, #f3ece0)" />
			<path d="M4 37 L22.5 4 L22.5 27 Z" fill="var(--piece-light-fill, #f3ece0)" />
		</g>
		<path d="M22.5 4 L41 37 L22.5 27 Z" fill="#000" opacity="0.08" />
		<path d="M41 37 L4 37 L22.5 27 Z" fill="#000" opacity="0.2" />
		<circle cx="38" cy="35.2" r="2.2" fill="var(--piece-dark-fill, #2b2b2b)" />
		<circle cx="7" cy="35.2" r="2.2" fill="var(--piece-dark-fill, #2b2b2b)" />
	</symbol>
</svg>
