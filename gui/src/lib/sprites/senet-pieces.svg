<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
	<!--
		Senet pieces, drawn rather than sourced.

		Surviving senet sets have two shapes of piece: cones and spools. The
		sides differ in shape as well as tone, so they read without colour: the
		Evens play cones (light), the Odds spools (dark), seen from the side.

		Sized 45x45 to match the chess sprite.
	-->
	<symbol id="senet-e" viewBox="0 0 45 45">
		<title>cone</title>
		<path d="M22.5 7 L35 36 Q22.5 41 10 36 Z" fill="var(--piece-light-fill, #f3ece0)"
			stroke="var(--piece-light-line, #3a3a3a)" stroke-width="1.5" stroke-linejoin="round" />
	</symbol>

	<symbol id="senet-o" viewBox="0 0 45 45">
		<title>spool</title>
		<path d="M11 9 H34 Q27 22.5 34 36 H11 Q18 22.5 11 9 Z" fill="var(--piece-dark-fill, #2b2b2b)"
			stroke="var(--piece-dark-line, #111)" stroke-width="1.5" stroke-linejoin="round" />
	</symbol>
</svg>
