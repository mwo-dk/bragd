name: CI

on:
  push:
    branches: [master] # all five machines on every merge; pull requests run Linux only until 1.0.0
  workflow_call: # from release.yml, for every release
  pull_request:

permissions:
  contents: read

# Line tables only: a failing test still names its file and line, and the build and its cache
# (rust-cache, from master) stay smaller.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# A newer push to a pull request cancels its older run. Called from release.yml, the group is that
# run's own (github.* is the caller's there), so nothing cancels it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # A pull request that only edits docs pages, CLAUDE.md, GLOSSARY.md, LICENSE or a packaging SUBMIT.md needs no
  # build: the machines below are skipped and "CI result" passes at once (the docs job still runs).
  # README.md and docs/changelog.md are not among them, nor an added, removed or renamed docs page:
  # those get a "page:" prefix, which never skips.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then printf 'code=true\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[] | if .status != "modified" and (.filename | test("^docs/.*\\.md$")) then "page:" + .filename else .filename end')
          printf '%s\n' "$files"
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvP '^(docs/(?!changelog\.md$)|CLAUDE\.md$|GLOSSARY\.md$|LICENSE$|packaging/.*/SUBMIT\.md$)'; then
            echo code=false >> "$GITHUB_OUTPUT"
          else
            echo code=true >> "$GITHUB_OUTPUT"
          fi

  test:
    name: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      # Until 1.0.0 nothing is released (CLAUDE.md), so a pull request builds on Linux only. Every
      # push to master, and every release, runs all five machines; a fault found there is fixed
      # in the next pull request. A skipped matrix entry is simply absent, so "CI result" is
      # unaffected.
      matrix:
        os: ${{ fromJSON(github.event_name != 'pull_request' && '["ubuntu-24.04", "ubuntu-24.04-arm", "macos-latest", "windows-latest", "windows-11-arm"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The desktop app's frontend and its Tauri crate come with the GUI slice. Until gui/ is
      # there, the steps that need it are skipped, and the Rust workspace is tested alone.
      - id: gui
        shell: bash
        run: if [ -f gui/package-lock.json ]; then echo exists=true; else echo exists=false; fi >> "$GITHUB_OUTPUT"

      - name: Linux libraries for the desktop app
        if: runner.os == 'Linux' && steps.gui.outputs.exists == 'true'
        uses: ./.github/actions/apt-install
        timeout-minutes: 10
        with:
          packages: libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      # Saved from master only, and not for the ARM Linux and Windows machines, which run only on
      # master: their caches would push the others out of the repository's 10 GB.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' && (runner.arch == 'X64' || runner.os == 'macOS') }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gui.outputs.exists == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json

      # The Tauri crate embeds gui/dist at compile time, so the frontend builds first.
      - name: Frontend
        if: steps.gui.outputs.exists == 'true'
        working-directory: gui
        shell: bash # PowerShell would carry on past a failing step
        run: |
          npm ci --no-audit --no-fund
          npx svelte-check
          npm test
          npm run build

      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # ARM Linux and Windows on ARM: releases bundle the desktop app there too, so the bundlers
      # have to run before a release finds out. A debug build, to reuse what the tests compiled;
      # no .rpm, whose packing of a debug binary takes over an hour on ARM.
      - name: Desktop installers on ARM
        if: runner.arch == 'ARM64' && runner.os != 'macOS' && steps.gui.outputs.exists == 'true'
        working-directory: gui
        shell: bash
        run: |
          npx tauri build --debug --ci --bundles ${{ runner.os == 'Linux' && 'deb,appimage' || 'nsis,msi' }}
          if [ "$RUNNER_OS" = Linux ]; then
            entry="$(dpkg-deb --fsys-tarfile ../target/debug/bundle/deb/*.deb | tar -xO --wildcards '*.desktop')"
            echo "$entry"
            grep -qx 'Exec=bragd-gui %F' <<<"$entry"
          else
            ls ../target/debug/bundle/msi/*_arm64_en-US.msi # the name packaging/release-assets.sh expects
          fi

      # Intel Macs: releases build for x86_64-apple-darwin too, so this target has to build
      # before a release finds out.
      - name: Intel Mac build
        if: runner.os == 'macOS' && steps.gui.outputs.exists == 'true'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build -p bragd-gui --target x86_64-apple-darwin --locked

  # The UI check (docs/screenshots/ui-check.py): every main screen at 390 and 1100 px, in the
  # screenshot sandbox, fails on text that does not fit, axe-core's contrast, label and focus
  # rules, and a board taller than a 700 px window.
  ui:
    name: UI check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Libraries, the sandbox and Broadway
        uses: ./.github/actions/apt-install
        timeout-minutes: 10
        with:
          packages: libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev bubblewrap libgtk-3-bin python3-venv
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ui-release
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Build
        run: |
          (cd gui && npm ci --no-audit --no-fund && npm run build)
          cargo build --release --locked -p bragd-gui -p bragd-helper
      # Ubuntu's AppArmor keeps unprivileged programs from making namespaces, which bwrap needs.
      # The image's Google Chrome stands in for chromium.
      # The demo home is made first: made by the sandbox on its first start, its Library's build
      # would outlast the wait for the window.
      - name: Check every screen
        env:
          CHROMIUM: google-chrome
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet websocket-client
          export DEMO_HOME="$RUNNER_TEMP/demo-home"
          docs/screenshots/demo-home.sh "$DEMO_HOME"
          cd docs/screenshots || exit 1
          "$RUNNER_TEMP/venv/bin/python" ui-check.py --shots "$RUNNER_TEMP/ui-shots"
      - name: What the app said
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/ui-shots"
          for f in /tmp/bragd-cap-*/gui-*.log /tmp/bragd-cap-*/not-drawn.png; do
            [ -e "$f" ] || continue
            cp "$f" "$RUNNER_TEMP/ui-shots/"
            case "$f" in *.log) echo "== $f"; tail -n 40 "$f" ;; esac
          done
      - name: Pictures of every screen checked
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-check
          path: ${{ runner.temp }}/ui-shots
          retention-days: 7

  # Links, anchors, the reading order, the changelog rows and screenshot placeholders, and the
  # workflows' own shell scripts: on every pull request and push, docs-only ones too.
  docs:
    name: Docs
    uses: ./.github/workflows/docs.yml

  # The one check branch protection requires: the machines above passed, or were not needed, and
  # the docs are current.
  result:
    name: CI result
    needs: [changes, test, ui, docs]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          TEST: ${{ needs.test.result }}
          UI: ${{ needs.ui.result }}
          DOCS: ${{ needs.docs.result }}
        run: |
          echo "changes: $CHANGES, test: $TEST, ui: $UI, docs: $DOCS"
          [ "$CHANGES" = success ] && [ "$DOCS" = success ] && { [ "$TEST" = success ] || [ "$TEST" = skipped ]; } && { [ "$UI" = success ] || [ "$UI" = skipped ]; }
