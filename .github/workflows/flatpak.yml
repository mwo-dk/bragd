name: Flatpak

# The app as a Flatpak (packaging/flatpak): its offline sources made from the lock files, built
# with flatpak-builder from the checkout, linted the way Flathub lints, then installed and
# started on a display of its own. Its bundle is a release file (release.yml). Nightly when
# master changed, and in every release; pull requests only when what goes into it changes.
on:
  push:
    branches: [master] # dependency or packaging changes; the rest is tested nightly
    paths:
      - "packaging/flatpak/**"
      - ".github/workflows/flatpak.yml"
      - "Cargo.lock"
      - "gui/package.json"
      - "gui/package-lock.json"
  workflow_call: # from release.yml (a release or rehearsal) and nightly.yml
  pull_request:
    # Pull requests run this system only when its packaging, its workflow or the dependencies
    # change; every other change is tested on it nightly and in every Release run.
    paths:
      - "packaging/flatpak/**"
      - ".github/workflows/flatpak.yml"
      - "Cargo.lock"
      - "gui/package.json"
      - "gui/package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Called from release.yml, the group is that
# run's own (github.* is the caller's there), so nothing cancels it.
concurrency:
  group: flatpak-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  MANIFEST: packaging/flatpak/io.github.mwo_dk.Bragd.yml

jobs:
  sources:
    name: Offline sources
    # A release pull request's (release/X.Y.Z) run is its Release run, after the merge.
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-24.04
    outputs:
      gui: ${{ steps.gui.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The app comes with the GUI slice: until gui/ is there, there is nothing to pack.
      - id: gui
        run: |
          if [ -f gui/package-lock.json ]; then echo exists=true; else echo "::notice::No gui/ yet: nothing to pack."; echo exists=false; fi >> "$GITHUB_OUTPUT"
      - if: steps.gui.outputs.exists == 'true'
        run: sh packaging/flatpak/sources.sh
      - if: steps.gui.outputs.exists == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-sources
          path: |
            packaging/flatpak/cargo-sources.json
            packaging/flatpak/node-sources.json

  build:
    name: Build and lint
    needs: sources
    if: needs.sources.outputs.gui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-sources
          path: packaging/flatpak
      # The SDK extensions from Flathub first, with tries (packaging/pkg-retry.sh); the build
      # below finds them installed.
      - name: Build dependencies
        run: sh packaging/pkg-retry.sh flatpak-builder --install-deps-from=flathub --install-deps-only "$RUNNER_TEMP/flatpak-deps" "$MANIFEST"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: ${{ env.MANIFEST }}
          bundle: bragd.flatpak
          artifact-name: bragd-flatpak
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock', 'gui/package-lock.json') }}
      # Flathub's linter, with what would need Flathub's exception (packaging/README.md) let through, and the
      # screenshots: they are taken from this version's tag, which exists only once it is released.
      - name: Lint
        run: |
          set -e
          lint() {
            flatpak-builder-lint "$@" > lint.json || true
            cat lint.json
            python3 - <<'EOF'
          import json
          allowed = {"finish-args-home-filesystem-access", "finish-args-flatpak-spawn-access", "appstream-screenshots-not-mirrored-in-ostree", "appstream-missing-screenshots", "metainfo-missing-screenshots", "appstream-external-screenshot-url"}
          text = open("lint.json").read().strip()
          errors = set(json.loads(text).get("errors", [])) if text else set()
          bad = errors - allowed
          raise SystemExit(f"lint: {sorted(bad)}" if bad else 0)
          EOF
          }
          lint manifest "$MANIFEST"
          lint repo repo

  smoke:
    name: Install and start
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bragd-flatpak
      - name: Flatpak, xvfb, dbus-x11
        uses: ./.github/actions/apt-install
        timeout-minutes: 10
        with:
          packages: flatpak xvfb dbus-x11
      - name: Flatpak and the GNOME runtime
        run: |
          set -e
          sh packaging/pkg-retry.sh flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sh packaging/pkg-retry.sh flatpak install --user -y --noninteractive flathub org.gnome.Platform//51
          flatpak install --user -y --noninteractive bragd.flatpak
      # The window opens and stays up for 40 seconds. A crash or a missing library ends it
      # before the time is up.
      - name: Start
        run: |
          export XDG_RUNTIME_DIR=/tmp/runtime && mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          rc=0
          dbus-run-session -- timeout -k 5 40 xvfb-run -a flatpak run io.github.mwo_dk.Bragd > app.log 2>&1 || rc=$?
          cat app.log
          [ "$rc" = 124 ] || { echo "::error::The app did not stay up (exit $rc)"; exit 1; }
          ! grep -i "panicked" app.log
