# coturn for the Bragd server's Calls, on the game service's host (packaging/server/README.md).
# Not deployed by any workflow: the owner installs coturn on the host and puts this file at
# /etc/turnserver.conf, with the secret and the host's names filled in.
#
# A Call's media goes directly between the two machines when it can. Only when no direct path
# exists does it go through here, still encrypted end to end (DTLS-SRTP): coturn relays packets it
# cannot read. It keeps no recording and no log of what it relays.

# STUN and TURN over UDP and TCP, and TURN over TLS for networks that allow only HTTPS-like
# traffic.
listening-port=3478
tls-listening-port=5349

# The relay ports; open them in the host's firewall, with 3478 and 5349.
min-port=49160
max-port=49260

# Time-limited credentials (TURN REST API): the game service hands each signed-in player a
# username `<expiry>:<user id>` and its HMAC-SHA1 under this secret (`GET /v1/turn`). Set the same
# value as BRAGD_SERVER_TURN_SECRET, and keep it out of the repository.
use-auth-secret
static-auth-secret=REPLACE_WITH_BRAGD_SERVER_TURN_SECRET
realm=bragd

# The certificate of the host's TURN name, from the same ACME client as the HTTPS proxy.
cert=/etc/coturn/fullchain.pem
pkey=/etc/coturn/privkey.pem
no-tlsv1
no-tlsv1_1

fingerprint
no-cli
no-multicast-peers
# A Call needs two allocations at most; a small cap keeps the cx23's bandwidth for many Calls.
user-quota=4
total-quota=200
# Never relay into the host's own networks.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Who connected and when, without what passed: enough to find abuse.
log-file=syslog
simple-log
