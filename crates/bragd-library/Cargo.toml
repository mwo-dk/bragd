[package]
name = "bragd-library"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Bragd's game databases: Foreign databases read in place, SQLite Libraries with Duplicates merged, Slices, and Parquet export"

[dependencies]
# The default for how far a packed file may unpack (`config::MAX_UNPACK_RATIO`).
bragd-core = { path = "../bragd-core" }
# `.pgn.bz2` (FICS), unpacked as it streams, in pure Rust.
bzip2 = "0.6"
encoding_rs = "0.8.42"
flate2 = "1.1.10"
memchr = "2"
# `.pgn.zst`, unpacked in pure Rust.
ruzstd = "0.9.0"
# Chess boards, moves and legality, for reading games (SAN, FEN, Polyglot keys).
rules-chess = { path = "../rules-chess" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Zips of PGN (TWIC), read member by member as they stream. Deflate only, in pure Rust.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# A Library's games exported for DuckDB to read. Pure Rust codecs only.
parquet = { version = "60", default-features = false, features = ["snap"] }

[dev-dependencies]
# The Variant ids a Library stores are checked against the catalogue.
bragd-games = { path = "../bragd-games" }
