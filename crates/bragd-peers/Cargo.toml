[package]
name = "bragd-peers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Peers: your own machines' Helpers, paired with a 6-digit code (SPAKE2) and talking only TLS with each other's pinned key"

[dependencies]
# The Helper folder, the time and private files.
bragd-core = { path = "../bragd-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TLS 1.3 with raw public keys (RFC 7250), on ring like the rest of Bragd's TLS.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
# Each machine's Ed25519 key, from the system's random source.
ring = "0.17"
# The pairing code turned into a shared key that an onlooker cannot test guesses against.
spake2 = "0.4"
# The key confirmation after SPAKE2.
hmac = "0.12"
sha2 = "0.10"
# The code itself, from the system's random source.
getrandom = "0.4"
# Finding Peers on the home network.
mdns-sd = { version = "0.21.6", default-features = false }
# The addresses of the home network, to listen on them only.
if-addrs = "0.15"

[target.'cfg(unix)'.dependencies]
# The machine's name.
libc = "0.2"

[dev-dependencies]
bragd-core = { path = "../bragd-core", features = ["test-home"] }
