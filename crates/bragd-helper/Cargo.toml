[package]
name = "bragd-helper"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The Helper: one background process per user that fetches Sources on a schedule, and imports and deduplicates Libraries for every Bragd window"

[[bin]]
name = "bragd-helper"
path = "src/main.rs"

[dependencies]
bragd-core = { path = "../bragd-core" }
bragd-library = { path = "../bragd-library" }
# Rating lists, fetched like Sources, go into the rating lists file.
bragd-clubs = { path = "../bragd-clubs" }
# Disk watch asks the container runtime what its engine images take, and engine matches run
# engines.
bragd-engines = { path = "../bragd-engines" }
# Background analysis keeps its results in the Position store.
bragd-positions = { path = "../bragd-positions" }
# Engine matches are played out in its rules.
bragd-games = { path = "../bragd-games" }
# Peers: the user's other machines, paired with a code.
bragd-peers = { path = "../bragd-peers" }
# Model jobs of the shared queue: a Peer's language model translates for this machine.
bragd-model = { path = "../bragd-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The connection token, from the system's random source.
getrandom = "0.4"
# Source downloads, with the system's certificate store.
ureq = { version = "3", features = ["platform-verifier"] }

# launchd's domain names the user by uid; Disk watch asks statvfs for the free space; background
# analysis asks localtime_r for the hour.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Whether a laptop runs on its battery, the free space on a disk, and the local hour for
# background analysis.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_Foundation"] }

[dev-dependencies]
bragd-core = { path = "../bragd-core", features = ["test-home"] }
# Zips of PGN, as TWIC sends them, made for the tests.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
